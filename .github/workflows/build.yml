name: Build AudioShare

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: dotnet publish AudioShare.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: AudioShare-win-x64
          path: publish/AudioShare.exe
